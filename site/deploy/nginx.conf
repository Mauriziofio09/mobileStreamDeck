# Zwei statische Startseiten, unterschieden am Host (Caddy leitet den Host-Header weiter).
# HTTPS und Sicherheits-Header macht Caddy davor.
map $host $site_root {
    default                                   /srv/mac;
    windowsmobilestreamdeck.battle-isle.app   /srv/windows;
}

server {
    listen 8080;
    server_name _;
    root $site_root;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # HTML immer neu prüfen (ETag); Bilder und Schriften dürfen einen Tag im Cache bleiben.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
    location ~* \.(webp|png|woff2)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
}
