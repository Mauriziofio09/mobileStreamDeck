# Copper-Deck-Startseiten auf dem Hetzner-Server (Ordner ~/mobilestreamdeck), Aufbau wie photoAI:
# statische Dateien aus ./mac und ./windows, ausgeliefert von nginx; HTTPS und Sicherheits-Header macht der
# bestehende Caddy aus ~/game. Dafür hängt der Container am Netzwerk game_default.
# Start/Update: docker compose up -d   (Dateien kommen per site/deploy/deploy.sh)
name: mobilestreamdeck

services:
  web:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine
    container_name: mobilestreamdeck-web
    user: "101:101"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./mac:/srv/mac:ro
      - ./windows:/srv/windows:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  proxy:
    external: true
    name: game_default
